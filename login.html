<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Professor Login</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f8fa;
      color: #2d3340;
    }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .login-card {
      width: min(100%, 420px);
      background: #fff;
      border: 1px solid #e1e5eb;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(27,42,73,0.08);
      padding: 2rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-family: Georgia, "Times New Roman", serif;
      color: #1b2a49;
      font-size: 2rem;
    }
    label {
      display: block;
      margin: 1rem 0 0.45rem;
      font-weight: 600;
      color: #1b2a49;
    }
    input {
      width: 100%;
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      padding: 0.8rem 0.9rem;
      font: inherit;
    }
    button {
      margin-top: 1.2rem;
      width: 100%;
      background: #2f5d9e;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0.9rem 1rem;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #1b2a49; }
    .message {
      margin-top: 1rem;
      min-height: 1.2rem;
      font-size: 0.93rem;
    }
    .message.error { color: #b00020; }
    .message.success { color: #0b6b3d; }
    .small-link {
      display: block;
      margin-top: 1rem;
      color: #2f5d9e;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1>Login</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="professor@example.edu" />

        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Enter password" />

        <button type="submit">Login</button>
      </form>
      <p id="login-message" class="message" aria-live="polite"></p>
      <a class="small-link" href="index.html">Back to public website</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
