<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Profile</title>
    <meta name="description" content="Academic profile website.">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===================== NAVIGATION ===================== -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="#home" class="site-name" id="nav-name">Academic Profile</a>

            <button class="menu-button" id="menu-button" aria-label="Open menu" aria-expanded="false">Menu</button>

            <nav class="site-nav" id="site-nav">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#research">Research</a>
                <a href="#publications">Publications</a>
                <a href="#projects">Projects</a>
                <a href="#education">Education</a>
                <a href="#news">News</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>

        <!-- ===================== HOME ===================== -->
        <section id="home" class="hero">
            <div class="container hero-inner">
                <div class="hero-text">
                    <p class="hero-position" id="hero-position"></p>
                    <h1 id="hero-name"></h1>
                    <p class="hero-university" id="hero-university"></p>
                    <p class="hero-description" id="hero-description"></p>
                    <div class="button-row">
                        <a href="#research" class="button button-primary">View Research</a>
                        <a href="#publications" class="button">Publications</a>
                        <a href="#contact" class="button">Contact</a>
                    </div>
                </div>
                <div class="hero-photo">
                    <img id="profile-image" src="images/profile.jpg" alt="Profile photo">
                </div>
            </div>
        </section>

        <!-- ===================== ABOUT ===================== -->
        <section id="about" class="section">
            <div class="container">
                <h2>About</h2>
                <div class="about-text" id="about-text"></div>
                <div id="memberships-block" class="subblock">
                    <h3>Professional Memberships</h3>
                    <ul class="plain-list" id="memberships-list"></ul>
                </div>
            </div>
        </section>

        <!-- ===================== RESEARCH ===================== -->
        <section id="research" class="section section-alt">
            <div class="container">
                <h2>Research</h2>
                <div class="research-list" id="research-list"></div>
            </div>
        </section>

        <!-- ===================== PUBLICATIONS ===================== -->
        <section id="publications" class="section">
            <div class="container">
                <h2>Publications</h2>
                <div class="filter-row" id="publication-filters"></div>
                <div id="publication-list"></div>
                <p class="full-list-note" id="full-list-note"></p>
            </div>
        </section>

        <!-- ===================== PROJECTS ===================== -->
        <section id="projects" class="section section-alt">
            <div class="container">
                <h2>Projects</h2>
                <div class="entry-list" id="project-list"></div>
            </div>
        </section>

        <!-- ===================== EDUCATION ===================== -->
        <section id="education" class="section">
            <div class="container">
                <h2>Education</h2>
                <div class="entry-list" id="education-list"></div>
                <div id="awards-block" class="subblock">
                    <h3>Honours and Awards</h3>
                    <div class="entry-list" id="award-list"></div>
                </div>
            </div>
        </section>

        <!-- ===================== NEWS ===================== -->
        <section id="news" class="section section-alt">
            <div class="container">
                <h2>News / Updates</h2>
                <div class="entry-list" id="news-list"></div>
            </div>
        </section>

        <!-- ===================== CONTACT ===================== -->
        <section id="contact" class="section">
            <div class="container">
                <h2>Contact</h2>
                <dl class="contact-list" id="contact-list"></dl>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container">
            <p id="footer-text"></p>
        </div>
    </footer>

    <!-- data.js must be loaded BEFORE script.js -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
